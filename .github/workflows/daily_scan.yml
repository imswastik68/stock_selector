name: Daily Stock Scan

on:
  schedule:
    - cron: "15 3 * * 1-5"   # 8:45 AM IST = 03:15 UTC, Mon–Fri (pre-market watchlist)
    - cron: "0 7 * * 1-5"    # 12:30 PM IST = 07:00 UTC, Mon–Fri (mid-day momentum check)
    - cron: "30 11 * * 1-5"  # 5:00 PM IST = 11:30 UTC, Mon–Fri (EOD scan)
    - cron: "0 4 1-3 * *"    # ~9:30 AM IST, days 1-3 of month (monthly momentum book,
                              # Phase 2 -- factor_scan.py itself no-ops except on the
                              # actual first weekday, so firing on all 3 days is safe)
  workflow_dispatch:            # manual trigger for testing

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download stock universe (NIFTY500 + SME)
        run: python scripts/download_universe.py || echo "Universe download failed; using fallback list"

      # Restore scan data (cache/ + outputs/) from the most recent prior run.
      # cache/ → pre-market can reuse yesterday's expensive downloads via load_latest()
      # outputs/ → mid-day scan needs yesterday's watchlist JSON for candidate tickers
      - name: Restore scan data cache
        uses: actions/cache@v4
        with:
          path: |
            cache/
            outputs/
          key: scan-data-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            scan-data-${{ runner.os }}-

      # Restore F&O ban cache from the previous run so we can compute the delta
      - name: Restore F&O ban cache
        uses: actions/cache@v4
        with:
          path: data/fo_ban_prev.json
          key: fo-ban-cache-${{ runner.os }}
          restore-keys: fo-ban-cache-

      # Pin SCAN_MODE from the cron that fired so mode is correct even when
      # GitHub Actions delays the job by minutes or hours.
      # Without this, a 31-min delay on the 8:45 AM IST cron silently becomes an EOD run.
      - name: Set scan mode
        run: |
          case "${{ github.event.schedule }}" in
            "15 3 * * 1-5") echo "SCAN_MODE=pre_market" >> $GITHUB_ENV ;;
            "0 7 * * 1-5")  echo "SCAN_MODE=mid_day"    >> $GITHUB_ENV ;;
            *)               echo "SCAN_MODE=eod"         >> $GITHUB_ENV ;;
          esac

      - name: Run stock scan
        if: github.event.schedule != '0 4 1-3 * *'
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INFERENCE_BACKEND: gemini
          RISK_CAPITAL: "1000000"

      # Monthly momentum book (Phase 2). scripts/factor_scan.py reuses
      # scripts/factor_backtest.py's cache/backtest_ohlcv/ CSVs, which main.py
      # never populates -- refresh them here before scanning. This cron is
      # its own dedicated trigger, so "Run stock scan" above is skipped to
      # avoid a redundant, unscheduled EOD run + duplicate Telegram alert.
      - name: Refresh price history for momentum book
        if: github.event.schedule == '0 4 1-3 * *'
        run: python scripts/backtest.py --weeks 260

      - name: Run monthly momentum scan
        if: github.event.schedule == '0 4 1-3 * *'
        run: python scripts/factor_scan.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Save updated F&O ban cache for tomorrow
      - name: Save F&O ban cache
        uses: actions/cache@v4
        with:
          path: data/fo_ban_prev.json
          key: fo-ban-cache-${{ runner.os }}

      # Persist the proprietary event archive. Runners are ephemeral and
      # data/event_archive/ is NOT gitignored -- without this commit-push step,
      # every day's archived events would evaporate when the runner is torn
      # down, defeating the entire point of accumulating this dataset.
      - name: Commit event archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/event_archive/
          if ! git diff --cached --quiet; then
            git commit -m "archive: $(date +%F) [skip ci]"
            # --autostash: the scan also dirties the git-tracked outputs/*.json
            # whitelist (performance/portfolio/live_proof), which this step does
            # NOT stage. Without it, rebase aborts with "cannot pull with rebase:
            # You have unstaged changes" (exit 128) and the archive never pushes.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No archive changes to commit"
          fi

      # Persist the live-proof record (Live-Proof Round Phase 1). Like the event
      # archive above, outputs/performance.json + outputs/portfolio.json +
      # outputs/live_proof.json are NOT cached-and-discarded -- they're the
      # immutable, git-committed audit trail of every live recommendation ever
      # made. A cache eviction (7-day idle or the 10 GB LRU cap -- cache/ alone is
      # already 1.8 GB) would otherwise permanently destroy the entire track
      # record with no way to reconstruct it. EOD-only: that's the run with the
      # real, final watchlist (pre_market/mid_day see partial/stale data and
      # would commit a less meaningful snapshot for the same calendar day).
      - name: Commit live-proof record
        if: always() && env.SCAN_MODE == 'eod'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/performance.json outputs/portfolio.json outputs/live_proof.json
          if ! git diff --cached --quiet; then
            git commit -m "live-proof: $(date +%F) [skip ci]"
            # --autostash: see the archive step above -- other tracked files are
            # left dirty by the scan and would otherwise abort the rebase.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No live-proof changes to commit"
          fi

      # Upload today's watchlist JSON as a run artifact
      - name: Upload watchlist artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchlist-${{ github.run_id }}
          path: outputs/
          retention-days: 30
